name: Validate Angular integration
on:
  push:
    branches: [ev3/integracion-integral]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run build -- --configuration local
