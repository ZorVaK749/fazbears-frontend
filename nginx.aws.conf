# TLS must terminate at the existing approved HTTPS ingress, not an image-baked key.
log_format frontend '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log frontend;
    js_import webpay from /etc/nginx/webpay-return.js;

    rewrite ^/ev3(?:/(.*))?$ /$1 last;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /checkout/webpay {
        client_max_body_size 4k;
        client_body_buffer_size 8k;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        js_content webpay.callback;
    }
    location ~* \.(?:js|mjs|css|map|woff2?|ico|png|jpe?g|gif|svg|webp|avif)$ {
        try_files $uri =404;
    }
}
